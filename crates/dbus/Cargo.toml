[package]
name = "karakulak-dbus"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "The blocking D-Bus calls karakulakd and the compositor make, on top of zbus 6"

[dependencies]
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy", "service"] }
serde = "1"
