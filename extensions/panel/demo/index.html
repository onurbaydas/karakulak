<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karakulak demo</title>
<meta name="description" content="Karakulak's own pages running in your browser, with made-up data.">
<link rel="icon" href="logo.svg">
<style>
	:root {
		--bg: #1d1a16;
		--fg: #f5f1ea;
		--muted: #b9ad9c;
		--accent: #c8955c;
		--bar: #ece7df;
		--bar-fg: #2a2621;
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; margin: 0; }
	body {
		background: var(--bg);
		color: var(--fg);
		font: 15px/1.4 system-ui, sans-serif;
		display: flex;
		flex-direction: column;
	}
	.note {
		padding: 8px 16px;
		display: flex;
		gap: 12px;
		align-items: center;
		flex-wrap: wrap;
		color: var(--muted);
	}
	.note strong { color: var(--fg); }
	.note a { color: var(--accent); }
	.note .spacer { flex: 1; }
	/* The screen: one fullscreen Firefox, its tabs at the bottom as in Karakulak. */
	.screen { flex: 1; position: relative; min-height: 0; }
	.screen > iframe { border: 0; width: 100%; height: 100%; display: block; background: #fff; }
	#panel-toggle { position: absolute; opacity: 0; pointer-events: none; }
	.popup {
		display: none;
		position: absolute;
		right: 12px;
		bottom: 12px;
		width: 22rem;
		max-width: calc(100% - 24px);
		height: min(640px, calc(100% - 24px));
		border-radius: 14px;
		overflow: hidden;
		box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
	}
	.popup iframe { border: 0; width: 100%; height: 100%; background: #f5f1ea; }
	#panel-toggle:checked ~ .screen .popup { display: block; }
	.bar {
		background: var(--bar);
		color: var(--bar-fg);
		display: flex;
		align-items: center;
		gap: 2px;
		padding: 4px;
		overflow-x: auto;
	}
	.bar a, .bar label {
		flex: 0 0 auto;
		padding: 6px 14px;
		border-radius: 8px;
		color: inherit;
		text-decoration: none;
		cursor: pointer;
		white-space: nowrap;
	}
	.bar a:hover, .bar label:hover { background: #fff; }
	.bar a:focus-visible, #panel-toggle:focus-visible + .screen + .bar label { outline: 2px solid var(--accent); }
	.bar .spacer { flex: 1; }
	.bar label { display: flex; align-items: center; gap: 6px; border: 1px solid var(--accent); }
	.bar label img { width: 18px; height: 18px; }
</style>
</head>
<body>
	<div class="note">
		<strong>Karakulak demo</strong>
		<span>The real pages of Karakulak, running in your browser. The data is made up, and nothing on your computer changes.</span>
		<span class="spacer"></span>
		<a href="../">Back</a>
		<a href="https://github.com/onurbaydas/karakulak/releases/latest">Download the ISO</a>
	</div>
	<input type="checkbox" id="panel-toggle" checked>
	<div class="screen">
		<iframe name="screen" src="newtab.html" title="Karakulak"></iframe>
		<div class="popup"><iframe src="popup.html" title="Panel"></iframe></div>
	</div>
	<nav class="bar">
		<a href="newtab.html" target="screen">New tab</a>
		<a href="files.html" target="screen">Files</a>
		<a href="tasks.html" target="screen">Task manager</a>
		<a href="settings.html" target="screen">Settings</a>
		<a href="install.html" target="screen">Install</a>
		<a href="help.html" target="screen">Help</a>
		<a href="shortcuts.html" target="screen">Shortcuts</a>
		<span class="spacer"></span>
		<label for="panel-toggle"><img src="icon.svg" alt="">Panel</label>
	</nav>
</body>
</html>
