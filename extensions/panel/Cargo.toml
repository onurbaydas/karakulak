[package]
name = "karakulak-panel"
description = "Karakulak system panel: clock, battery and power"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
leptos.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
karakulak-browser.workspace = true
wasm-bindgen-futures.workspace = true
vt100 = "0.18.1"
base64 = "0.22"
serde_json = { version = "1", optional = true }

[features]
# The pages on a plain website, with made-up answers instead of karakulakd.
demo = ["dep:serde_json", "karakulak-browser/demo"]
