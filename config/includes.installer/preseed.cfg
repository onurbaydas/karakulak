# Defaults for the Karakulak installer. Partitioning, user and password are
# still asked interactively.

d-i debian-installer/locale string tr_TR.UTF-8
d-i keyboard-configuration/xkb-keymap select tr
d-i netcfg/get_hostname string karakulak
d-i passwd/root-login boolean false

# Auto-login the user created during installation instead of the live user.
d-i preseed/late_command string \
	in-target sh -c 'u=$(getent passwd 1000 | cut -d: -f1); sed -i "s/--autologin karakulak/--autologin $u/" /etc/systemd/system/getty@tty1.service.d/autologin.conf'
