# Karakulak: networks should not be able to recognize this computer.

[device]
# A random address while searching for networks.
wifi.scan-rand-mac-address=yes

[connection]
# A different address for every Wi-Fi network, the same one each time for the
# same network (so captive portals keep working).
wifi.cloned-mac-address=stable
# Do not tell the network this computer's name.
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
# Temporary IPv6 addresses instead of ones derived from the hardware.
ipv6.ip6-privacy=2
