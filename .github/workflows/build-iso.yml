name: Build

on:
  push:
    branches: [main]
    # A version tag (v0.9.0) also publishes the package and a GitHub release.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: karakulakd
        working-directory: daemon
        run: |
          cargo clippy --release
          cargo test
          cargo build --release
      - name: Extensions
        working-directory: extensions
        run: cargo clippy --target wasm32-unknown-unknown --release
      - uses: actions/upload-artifact@v7
        with:
          name: karakulakd
          path: daemon/target/release/karakulakd

  # Known vulnerabilities in dependencies stop the build.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit
        run: |
          for dir in daemon compositor extensions crates/ddc; do
            echo "== $dir"
            (cd "$dir" && cargo audit)
          done

  # Built on Debian so it links against the same libraries as the image.
  compositor:
    runs-on: ubuntu-latest
    container:
      image: rust:1-trixie
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libseat-dev libinput-dev libgbm-dev \
            libdisplay-info-dev libxkbcommon-dev libwayland-dev libudev-dev libegl-dev libpam0g-dev pkg-config
      - name: Build
        working-directory: compositor
        run: |
          rustup component add clippy
          cargo clippy --release
          cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: karakulak-compositor
          path: compositor/target/release/karakulak-compositor

  # Signs extensions whose version changed and commits the signed .xpi files.
  # Only for releases (version tags) or by hand: every upload counts against
  # Mozilla's rate limit, and every version goes through review.
  sign:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    # One at a time: parallel runs would both commit the same .xpi files.
    concurrency:
      group: sign-extensions
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sign
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: extensions/sign.sh

      - name: Commit signed extensions
        run: |
          git add config/includes.chroot/usr/share/karakulak/extensions
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update signed extensions [skip ci]"
          # main may have moved while we were signing.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1

  # The karakulak package: installed in the image, and what installed systems
  # update from (Karakulak's APT repository, published on version tags).
  deb:
    needs: [test, compositor, sign]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.compositor.result == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: karakulakd
          path: daemon/target/release
      - uses: actions/download-artifact@v8
        with:
          name: karakulak-compositor
          path: compositor/target/release
      - name: Build
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF#refs/tags/v}" ;;
            # Lower than any release, so released packages replace it.
            *) version="0.0.$(date -u +%Y%m%d%H%M)~${GITHUB_SHA%"${GITHUB_SHA#???????}"}" ;;
          esac
          scripts/build-deb.sh "$version" debs
      # Clashing files or dpkg questions fail here, before the ISO build.
      - name: Install test
        run: tests/install-test.sh debs/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: karakulak-deb
          path: debs/*.deb

  iso:
    needs: [test, audit, compositor, sign, deb]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.audit.result == 'success' && needs.deb.result == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          # Pick up the signed extensions the sign job may have just pushed.
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: karakulakd
          path: config/includes.chroot/usr/bin

      - uses: actions/download-artifact@v8
        with:
          name: karakulak-compositor
          path: config/includes.chroot/usr/bin

      - uses: actions/download-artifact@v8
        with:
          name: karakulak-deb
          path: config/packages.chroot

      - name: Install live-build
        run: |
          chmod +x config/includes.chroot/usr/bin/karakulakd config/includes.chroot/usr/bin/karakulak-compositor
          apt-get update
          apt-get install -y live-build

      - name: Build ISO
        run: |
          lb config
          lb build

      - uses: actions/upload-artifact@v7
        with:
          name: karakulak-iso
          path: "*.iso"
          if-no-files-found: error

  # Boots the ISO and checks that the session comes up.
  boot:
    needs: iso
    # Runs even when signing failed earlier; only the ISO matters here.
    if: ${{ !cancelled() && needs.iso.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: karakulak-iso
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso socat
          sudo chmod 666 /dev/kvm || true
      - name: Boot test
        run: tests/boot-test.sh *.iso boot-test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: boot-test
          path: boot-test

  # On a version tag: the APT repository on GitHub Pages and a GitHub release
  # with the ISO, its checksums and their signature.
  publish:
    needs: [deb, iso, boot]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.boot.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: karakulak-deb
          path: debs
      - uses: actions/download-artifact@v8
        with:
          name: karakulak-iso
          path: iso
      - name: Signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y apt-utils
          echo "$APT_SIGNING_KEY" | gpg --batch --import
      - name: APT repository
        run: |
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add site origin/gh-pages
          else
            git worktree add --detach site
            (cd site && git checkout --orphan gh-pages && git rm -rfq .)
          fi
          scripts/update-apt-repo.sh debs site/apt
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "APT repository: ${GITHUB_REF#refs/tags/}"
          git push origin HEAD:gh-pages
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          mv iso/*.iso "karakulak-$tag-amd64.iso"
          sha256sum "karakulak-$tag-amd64.iso" debs/*.deb | sed 's|debs/||' > SHA256SUMS
          gpg --batch --armor --detach-sign SHA256SUMS
          previous=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          {
            echo "## Changes"
            git log --format='- %s' ${previous:+"$previous..$tag"} | grep -v '\[skip ci\]'
            echo
            echo "Verify: \`gpg --verify SHA256SUMS.asc && sha256sum -c SHA256SUMS\` (key: karakulak-archive-key.asc)"
          } > notes.md
          gh release create "$tag" --title "Karakulak $tag" --notes-file notes.md \
            "karakulak-$tag-amd64.iso" debs/*.deb SHA256SUMS SHA256SUMS.asc config/archives/karakulak-archive-key.asc
