name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: karakulakd
        working-directory: daemon
        run: |
          cargo clippy --release
          cargo test
          cargo build --release
      - name: Extensions
        working-directory: extensions
        run: cargo clippy --target wasm32-unknown-unknown --release
      - uses: actions/upload-artifact@v4
        with:
          name: karakulakd
          path: daemon/target/release/karakulakd

  # Built on Debian so it links against the same libraries as the image.
  compositor:
    runs-on: ubuntu-latest
    container:
      image: rust:1-trixie
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libseat-dev libinput-dev libgbm-dev \
            libdisplay-info-dev libxkbcommon-dev libwayland-dev libudev-dev libegl-dev libpam0g-dev pkg-config
      - name: Build
        working-directory: compositor
        run: |
          rustup component add clippy
          cargo clippy --release
          cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: karakulak-compositor
          path: compositor/target/release/karakulak-compositor

  # Signs extensions whose version changed and commits the signed .xpi files.
  sign:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sign
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: extensions/sign.sh

      - name: Commit signed extensions
        run: |
          git add config/includes.chroot/usr/share/karakulak/extensions
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update signed extensions [skip ci]"
          # main may have moved while we were signing.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1

  iso:
    needs: [test, compositor, sign]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.compositor.result == 'success' }}
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          # Pick up the signed extensions the sign job may have just pushed.
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: karakulakd
          path: config/includes.chroot/usr/bin

      - uses: actions/download-artifact@v4
        with:
          name: karakulak-compositor
          path: config/includes.chroot/usr/bin

      - name: Install live-build
        run: |
          chmod +x config/includes.chroot/usr/bin/karakulakd config/includes.chroot/usr/bin/karakulak-compositor
          apt-get update
          apt-get install -y live-build

      - name: Build ISO
        run: |
          lb config
          lb build

      - uses: actions/upload-artifact@v4
        with:
          name: karakulak-iso
          path: "*.iso"
          if-no-files-found: error

  # Boots the ISO and checks that the session comes up.
  boot:
    needs: iso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: karakulak-iso
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso socat
          sudo chmod 666 /dev/kvm || true
      - name: Boot test
        run: tests/boot-test.sh *.iso boot-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-test
          path: boot-test
