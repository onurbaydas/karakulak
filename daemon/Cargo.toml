[package]
name = "karakulakd"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Karakulak system helper for Firefox extensions (native messaging host)"

[dependencies]
ddc-hi = { version = "0.4.1", default-features = false, features = ["ddc-i2c"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
strip = true
