[package]
name = "karakulakd"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Karakulak system helper for Firefox extensions (native messaging host)"

[dependencies]
karakulak-ddc = { path = "../crates/ddc" }
base64 = "0.22"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libc = "0.2"
portable-pty = "0.9"
serde_json = "1"
trash = "5"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
strip = true
