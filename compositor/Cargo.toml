[package]
name = "karakulak-compositor"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Karakulak's Wayland compositor: every screen shows a fullscreen Firefox"

[dependencies]
karakulak-ddc = { path = "../crates/ddc" }
xcursor = "0.3.3"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
libc = "0.2"
png = "0.17"
dirs = "6"

# Pinned to the commit the code was written against; Smithay's API moves fast.
[dependencies.smithay]
git = "https://github.com/Smithay/smithay"
rev = "f581531"
default-features = false
features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "renderer_multi",
    "wayland_frontend",
    "desktop",
]

[dependencies.smithay-drm-extras]
git = "https://github.com/Smithay/smithay"
rev = "f581531"

[profile.release]
strip = true
